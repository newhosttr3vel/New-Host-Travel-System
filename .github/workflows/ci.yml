name: Quality checks
on:
  pull_request:
  push:
    branches: [main, "feature/google-sheets-storage"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXTAUTH_SECRET: ci-only-secret-that-is-long-enough-to-pass-validation
      NEXTAUTH_URL: http://localhost:3000
      GOOGLE_CLIENT_ID: ci-placeholder
      GOOGLE_CLIENT_SECRET: ci-placeholder
      GOOGLE_SHEETS_ID: ci-placeholder
      GOOGLE_SERVICE_ACCOUNT_EMAIL: ci-placeholder@example.iam.gserviceaccount.com
      GOOGLE_PRIVATE_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
