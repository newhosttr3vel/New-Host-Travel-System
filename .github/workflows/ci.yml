name: Quality checks
on:
  pull_request:
  push:
    branches: [main, "release/**", "feature/**"]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: new_host_travel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d new_host_travel"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ci_user:ci_password@127.0.0.1:5432/new_host_travel?schema=public
      BETTER_AUTH_SECRET: ci-only-secret-that-is-long-enough-to-pass-validation
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_TRUSTED_ORIGINS: http://localhost:3000
      RUN_DB_TESTS: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.18.0
      - name: Check local startup helper syntax
        run: node --check scripts/local.mjs
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
      - name: Apply non-breaking dependency security updates
        run: npm audit fix || true
      - name: Persist generated dependency lockfile on this PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: lock audited dependency tree"
            git push origin "HEAD:refs/heads/$GITHUB_HEAD_REF"
          fi
      - name: Capture generated dependency lockfile and audit report
        run: npm audit --json > npm-audit.json || true
      - name: Upload dependency audit and lockfile
        uses: actions/upload-artifact@v7
        with:
          name: dependency-audit-and-lockfile
          path: |
            npm-audit.json
            package-lock.json
          if-no-files-found: error
          retention-days: 14
      - name: Validate PostgreSQL migrations
        run: npm run db:migrate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
