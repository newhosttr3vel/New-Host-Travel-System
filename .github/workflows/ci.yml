name: Quality checks
on:
  pull_request:
  push:
    branches: [main, "release/**", "feature/**"]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: new_host_travel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d new_host_travel"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ci_user:ci_password@127.0.0.1:5432/new_host_travel?schema=public
      APP_DATABASE_URL: postgresql://ci_runtime:ci_runtime_password@127.0.0.1:5432/new_host_travel?schema=public
      RESEND_API_KEY: re_ci_dummy_key
      AUTH_EMAIL_FROM: "New Host Travel <no-reply@example.test>"
      BETTER_AUTH_SECRET: ci-only-secret-that-is-long-enough-to-pass-validation
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_TRUSTED_ORIGINS: http://localhost:3000
      RUN_DB_TESTS: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22.18.0
      - name: Check local startup helper syntax
        run: node --check scripts/local.mjs
      - name: Resolve and install locked dependencies
        run: |
          npm install --package-lock-only --ignore-scripts
          npm ci
      - name: Apply non-breaking dependency security updates
        run: npm audit fix || true
      - name: Persist generated dependency lockfile on this PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: lock audited dependency tree"
            git push origin "HEAD:refs/heads/$GITHUB_HEAD_REF"
          fi
      - name: Capture generated dependency lockfile and audit report
        run: npm audit --json > npm-audit.json || true
      - name: Upload dependency audit and lockfile
        uses: actions/upload-artifact@v7
        with:
          name: dependency-audit-and-lockfile
          path: |
            npm-audit.json
            package-lock.json
          if-no-files-found: error
          retention-days: 14
      - name: Enforce clean dependency audit
        run: |
          node -e "const audit = require('./npm-audit.json'); const total = audit.metadata?.vulnerabilities?.total ?? 0; if (total > 0) { console.error('Dependency audit reported ' + total + ' vulnerabilities.'); process.exit(1); }"
      - name: Validate PostgreSQL migrations
        run: npm run db:migrate
      - name: Provision a non-owner runtime login for RLS tests
        run: |
          node --input-type=module <<'NODE'
          import pg from "pg";
          const client = new pg.Client({ connectionString: process.env.DATABASE_URL });
          await client.connect();
          try {
            const exists = await client.query("SELECT 1 FROM pg_roles WHERE rolname = 'ci_runtime'");
            if (exists.rowCount === 0) {
              await client.query("CREATE ROLE ci_runtime LOGIN PASSWORD 'ci_runtime_password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS INHERIT");
            }
            await client.query("GRANT new_host_app TO ci_runtime");
          } finally { await client.end(); }
          NODE
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
