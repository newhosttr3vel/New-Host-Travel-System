[package]
name = "new-host-travel-app"
version = "0.1.0"
description = "New Host Travel desktop and mobile application"
authors = ["New Host Travel"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "new_host_travel_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }